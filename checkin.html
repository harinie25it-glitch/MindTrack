<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Check-in</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="topbar">

        <h2>🧠 MindTrack</h2>

        <a href="dashboard.html">Dashboard</a>

    </header>


    <main class="checkin-container">

        <div class="checkin-card">

            <h1>🌱 Daily Wellbeing Check-in</h1>

            <p>
                Take a moment to check in with yourself.
            </p>


            <form id="checkinForm">


                <label>
                    How are you feeling today?
                </label>

                <select id="mood">

                    <option value="1">😞 Very Low</option>
                    <option value="2">🙁 Low</option>
                    <option value="3" selected>😐 Okay</option>
                    <option value="4">🙂 Good</option>
                    <option value="5">😄 Very Good</option>

                </select>


                <label>
                    How would you rate your stress?
                </label>

                <select id="stress">

                    <option value="1">Very Low</option>
                    <option value="2">Low</option>
                    <option value="3" selected>Moderate</option>
                    <option value="4">High</option>
                    <option value="5">Very High</option>

                </select>


                <label>
                    How many hours did you sleep?
                </label>

                <input
                    type="number"
                    id="sleep"
                    min="0"
                    max="24"
                    step="0.5"
                    placeholder="Example: 7"
                    required
                >


                <label>
                    How many hours did you study/work?
                </label>

                <input
                    type="number"
                    id="study"
                    min="0"
                    max="24"
                    step="0.5"
                    placeholder="Example: 5"
                    required
                >


                <label>
                    Anything you'd like to note?
                </label>

                <textarea
                    id="journal"
                    rows="5"
                    placeholder="Optional reflection..."
                ></textarea>


                <button type="submit">
                    Save Check-in
                </button>


            </form>

        </div>

    </main>


    <script src="checkin.js"></script>

</body>

</html>
