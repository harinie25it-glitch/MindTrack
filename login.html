<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - MindTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-icon">
            🧠
        </div>

        <h1>MindTrack</h1>

        <p class="login-subtitle">
            Student Wellbeing Platform
        </p>

        <form id="loginForm">

            <label>Student Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your student email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="login-note">
            🔐 Your wellbeing information is designed to remain private.
        </p>

        <p class="demo-note">
            Demo login: use any valid email and password.
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
